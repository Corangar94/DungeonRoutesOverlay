name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ./method-route-overlay

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: method-route-overlay/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run make

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            method-route-overlay/out/make/squirrel.windows/x64/*.exe
            method-route-overlay/out/make/squirrel.windows/x64/*.nupkg
